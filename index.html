<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#09070c">
<title>解放的哈爾巴斯｜3D 王族陵墓戰記</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<header class="top-ui">
 <div class="portrait"><span>♛</span><b id="level">91</b></div>
 <div class="vitals"><div class="bar hp"><i id="hpbar"></i><b id="hptext">42198 / 42198</b></div><div class="bar mp"><i id="mpbar"></i><b id="mptext">5621 / 5621</b></div><div class="statsline">⚔ 32767　♜ 328　♙ 64　✦ 85</div></div>
 <div class="currency"><span>💎 3,200</span><span>🟡 120,375,680</span></div>
 <nav><span>商店</span><span>背包</span><span>技能</span><span>任務</span><span>☰</span></nav>
</header>
<div class="buffs"><b>BUFF</b><span>✥</span><span>♜</span><span>✧</span><span>❖</span><span>✺</span><span>✥</span><span>✧</span><span>♜</span></div>
<aside class="minimap"><div class="sun">☀ 16:28</div><div class="mapgrid"><i class="playerdot"></i><i class="mob m1"></i><i class="mob m2"></i><i class="mob m3"></i><i class="mob m4"></i></div><b>古代王族陵墓 B2</b><small>安全區域</small><div class="kill">擊殺數 <strong id="kills">0</strong></div><div class="timer" id="timer">00:00</div></aside>
<div class="damage-layer" id="damage"></div>
<div class="quest"><b>【主線】亡靈的復甦</b><br>消滅哈爾巴斯的手下 <span id="questkills">0</span>/500<br><em>獲得經驗與戰利品</em></div>
<div class="joystick" id="joystick"><div id="stick"></div></div>
<div class="right-controls"><button id="auto" class="auto active">AUTO</button><button id="attack" class="attack">⚔</button></div>
<div class="hotbar"><button class="skill selected">✧</button><button class="skill">◈</button><button class="skill" id="skill">✹</button><button class="skill">✥</button><button class="skill">☼</button><button class="potion">🧪</button><button class="potion">🔵</button><button class="potion">📜</button></div>
<div class="expbar"><span>EXP <b id="xptext">0.00%</b></span><i><b id="xpbar"></b></i></div>
<div class="toast" id="toast">3D 王族陵墓戰場載入中</div>
<div class="levelup hidden" id="levelup"><section><h2>力量覺醒</h2><p>選擇一項能力提升</p><button data-up="power">攻擊力 +25%</button><button data-up="health">最大生命 +30</button><button data-up="speed">移動速度 +15%</button></section></div>
<div class="help">左側搖桿移動・右側攻擊・AUTO 自動戰鬥・PC：WASD / 空白鍵 / Q</div>
<script>
(function () {
  const sources = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.159.0/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js',
    'https://unpkg.com/three@0.159.0/build/three.min.js'
  ];
  const toast = document.getElementById('toast');
  let index = 0;
  function showError(message) {
    toast.textContent = message;
    toast.classList.remove('fade');
    toast.classList.add('error');
  }
  function loadNext() {
    if (index >= sources.length) {
      showError('3D 引擎下載失敗。請確認網路可連線，或稍後重新整理。');
      return;
    }
    const url = sources[index++];
    const script = document.createElement('script');
    script.src = url;
    script.onload = function () {
      if (!window.THREE) {
        loadNext();
        return;
      }
      const app = document.createElement('script');
      app.src = 'main.js?v=safari-fix';
      app.onload = function () {
        setTimeout(function () {
          const canvas = document.querySelector('#stage canvas');
          if (!canvas) showError('3D 引擎已下載，但畫面建立失敗。請截圖回報。');
        }, 1500);
      };
      app.onerror = function () { showError('遊戲程式 main.js 載入失敗。'); };
      document.body.appendChild(app);
    };
    script.onerror = loadNext;
    document.head.appendChild(script);
  }
  loadNext();
})();
</script>
</body></html>
