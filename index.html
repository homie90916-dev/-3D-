<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>解放的哈爾巴斯：覺醒 FINAL 5.3</title>
  <link rel="stylesheet" href="./style.css?v=final-5-3">
</head>
<body>
  <div id="game"><canvas id="world"></canvas></div>
  <div id="hud">
    <header class="topbar">
      <div class="brand">解放的哈爾巴斯 <small>FINAL 5.3・怪物與戰鬥精修</small></div>
      <div class="stats">
        <div class="stat"><span>HP</span><div class="bar"><i id="hpBar"></i></div><b id="hpText">100/100</b></div>
        <div class="stat"><span>MP</span><div class="bar mana"><i id="mpBar"></i></div><b id="mpText">60/60</b></div>
        <div class="stat"><span>EXP</span><div class="bar exp"><i id="xpBar"></i></div><b id="levelText">Lv.1</b></div>
      </div>
    </header>
    <div class="right-info"><div>擊殺 <b id="kills">0</b></div><div>波次 <b id="wave">1</b></div></div>
    <div id="message">2D／2.5D 角色風格・拖曳搖桿移動</div>
    <div class="bottom-ui">
      <div class="left-controls">
        <div id="joystick" aria-label="移動搖桿"><div id="stick"></div></div>
        <span class="hint">拖曳移動</span>
      </div>
      <div class="right-controls">
        <button id="autoBtn" class="toggle active">自動攻擊：開</button>
        <button id="attackBtn" class="action">普通攻擊</button>
        <button id="skillBtn" class="skill">哈爾巴斯爆炎</button>
      </div>
    </div>
    <div id="levelUp" class="modal hidden">
      <div class="panel"><h2>力量覺醒</h2><p>選擇一項能力提升</p>
        <div class="choices">
          <button data-up="power">攻擊力 +25%</button>
          <button data-up="health">最大生命 +30</button>
          <button data-up="speed">移動速度 +15%</button>
        </div>
      </div>
    </div>
    <div id="gameOver" class="modal hidden">
      <div class="panel"><h2>哈爾巴斯暫時沉眠</h2><p id="finalStats"></p><button id="restartBtn" class="action">重新覺醒</button></div>
    </div>
  </div>
  <script src="./main.js?v=final-5-3"></script>
</body>
</html>
